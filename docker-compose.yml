services:
    php:
        build:
            context: ./docker/php
        container_name: course_php
        volumes:
            - ./:/var/www/html
        working_dir: /var/www/html
        depends_on:
            - postgres

    nginx:
        image: nginx:alpine
        container_name: course_nginx
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php

    postgres:
        image: postgres:16
        container_name: course_postgres
        restart: always
        environment:
            POSTGRES_USER: symfony
            POSTGRES_PASSWORD: secret
            POSTGRES_DB: symfony
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - "5432:5432"

volumes:
    pgdata:
